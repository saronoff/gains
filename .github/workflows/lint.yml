name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check public/app.js
          node --check public/sw.js

      - name: ESLint
        run: npx --yes eslint@9 public/app.js public/sw.js
